<script>
Chart.register(ChartDataLabels);

let map, screenshoter;
let polygons = [], labels = [];
let rawDistricts = [], visibleMunicipalities = [];
let chart = null, chart2 = null;
let exportRows = [];
let allMunicipalities = new Set();
let allDates = new Set();
let categoryData = {};
let miniCharts = {};
let monthlyData = {}; // تخزين البيانات الشهرية

const colors = [
    "#e74c3c", "#e67e22", "#f39c12", "#27ae60", "#16a085",
    "#2980b9", "#8e44ad", "#c0392b", "#2c3e50", "#7f8c8d",
    "#1abc9c", "#3498db", "#9b59b6", "#34495e", "#16a085"
];

function initMap() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
    }).setView([21.4, 40.4], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        crossOrigin: true
    }).addTo(map);

    screenshoter = L.simpleMapScreenshoter({
        screenName: 'خريطة_البلديات',
        hidden: true,
        hideElementsWithSelectors: ['.custom-zoom']
    }).addTo(map);
}

function loadExcel() {
    const file = document.getElementById("file").files[0];
    if (!file) { 
        alert('الرجاء اختيار ملف'); 
        return; 
    }

    const reader = new FileReader();
    reader.onload = e => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        processRows(rows);
    };
    reader.readAsArrayBuffer(file);
}

function processRows(rows) {
    let mapData = {}, total = 0;
    allMunicipalities.clear();
    allDates.clear();
    categoryData = {};
    monthlyData = {}; // إعادة تعيين البيانات الشهرية
    let municipalityDistricts = {};

    for (let i = 1; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length < 3) continue;

        let lng = parseFloat(r[0]);
        let lat = parseFloat(r[1]);
        let districtName = String(r[2] || "غير معروف").trim();
        let muni = String(r[3] || "غير محدد").trim();
        let date = String(r[4] || "غير معروف").trim();
        let category = String(r[5] || "غير محدد").trim();

        if (isNaN(lat) || isNaN(lng)) continue;

        total++;
        allMunicipalities.add(muni);
        allDates.add(date);

        if (!categoryData[category]) categoryData[category] = 0;
        categoryData[category]++;

        // تخزين البيانات الشهرية
        if (!monthlyData[date]) {
            monthlyData[date] = {};
        }
        if (!monthlyData[date][muni]) {
            monthlyData[date][muni] = 0;
        }
        monthlyData[date][muni]++;

        if (!municipalityDistricts[muni]) {
            municipalityDistricts[muni] = {};
        }
        if (!municipalityDistricts[muni][districtName]) {
            municipalityDistricts[muni][districtName] = 0;
        }
        municipalityDistricts[muni][districtName]++;

        let key = muni + "||" + date + "||" + i;
        if (!mapData[key]) {
            mapData[key] = { municipality: muni, date, points: [], categories: new Set(), districts: new Set() };
        }
        mapData[key].points.push({ lat, lng });
        mapData[key].categories.add(category);
        mapData[key].districts.add(districtName);
    }

    window.municipalityDistrictsData = municipalityDistricts;

    fillSelect("municipalityFilter", allMunicipalities);
    fillSelect("dateFilter", allDates);

    let mergedData = {};
    Object.values(mapData).forEach(d => {
        let mergeKey = d.municipality;
        if (!mergedData[mergeKey]) {
            mergedData[mergeKey] = { 
                municipality: d.municipality, 
                date: d.date, 
                points: [], 
                categories: new Set(),
                districts: new Set()
            };
        }

        d.points.forEach(p => {
            let isDuplicate = mergedData[mergeKey].points.some(existing => 
                Math.abs(existing.lat - p.lat) < 0.0001 && 
                Math.abs(existing.lng - p.lng) < 0.0001
            );
            if (!isDuplicate) {
                mergedData[mergeKey].points.push(p);
            }
        });

        d.categories.forEach(c => mergedData[mergeKey].categories.add(c));
        d.districts.forEach(dist => mergedData[mergeKey].districts.add(dist));
    });

    rawDistricts = Object.values(mergedData).map((d, i) => {
        let cLat = d.points.reduce((s, p) => s + p.lat, 0) / d.points.length;
        let cLng = d.points.reduce((s, p) => s + p.lng, 0) / d.points.length;

        return {
            ...d,
            count: d.points.length,
            centerLat: cLat,
            centerLng: cLng,
            color: colors[i % colors.length],
            uniqueId: i
        };
    }).sort((a, b) => b.count - a.count);

    document.getElementById("totalReports").textContent = total;
    document.getElementById("totalDistricts").textContent = rawDistricts.length;

function convexHull(points) {
    const pts = points.map(p => [p.lat, p.lng]);
    if (pts.length <= 3) return pts.map(p => ({ lat: p[0], lng: p[1] }));

    pts.sort((a, b) => a[0] === b[0] ? a[1] - b[1] : a[0] - b[0]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];

    for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
        lower.push(p);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
        upper.push(p);
    }
    upper.pop(); 
    lower.pop();
    return lower.concat(upper).map(p => ({ lat: p[0], lng: p[1] }));
}

        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

                        ticks: { font: { size: 11, weight: '900' }, color: '#000' }
                    },
                    x: { 
                        grid: { display: false }, 
                        ticks: { 
                            font: { size: 12, weight: '900' }, 
                            color: '#333', 
                            maxRotation: 45,
                            autoSkip: false
                        } 
                    }
                }
            }
        });
    });
}

function drawExportMainChart() {
    const ctx = document.getElementById('exportChart');
    if (!ctx) return;

    new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
            labels: visibleMunicipalities.map(d => d.municipality),
            datasets: [{
                data: visibleMunicipalities.map(d => d.count),
                backgroundColor: visibleMunicipalities.map(d => d.color),
                borderRadius: 6,
                borderSkipped: false,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
                legend: { display: false },
                datalabels: {
                    display: true,
                    anchor: 'end',
                    align: 'top',
                    color: '#000',
                    font: { weight: '900', size: 12 },
                    formatter: (value) => value
                }
            },
            scales: {
                y: { 
                    beginAtZero: true, 
                    grid: { color: 'rgba(0,0,0,0.1)' },
                    ticks: { font: { size: 11, weight: '900' } }
                },
                x: { 
                    grid: { display: false }, 
                    ticks: { maxRotation: 45, minRotation: 45, font: { size: 10, weight: '900' } } 
                }
            }
        }
    });
}

function drawExportCategoriesChart() {
    const ctx = document.getElementById('exportCategoriesChart');
    if (!ctx) return;

    const cats = Object.keys(categoryData);
    const vals = Object.values(categoryData);

    const sorted = cats.map((cat, i) => ({ cat, val: vals[i], color: colors[i % colors.length] }))
                       .sort((a, b) => b.val - a.val);

    new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
            labels: sorted.map(s => s.cat),
            datasets: [{
                data: sorted.map(s => s.val),
                backgroundColor: sorted.map(s => s.color),
                borderRadius: 6,
                borderSkipped: false,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            indexAxis: 'y',
            plugins: {
                legend: { display: false },
                datalabels: {
                    anchor: 'end',
                    align: 'right',
                    color: '#000',
                    font: { weight: '900', size: 14 },
                    formatter: (value) => value
                }
            },
            scales: {
                x: { 
                    beginAtZero: true, 
                    grid: { color: 'rgba(0,0,0,0.1)' },
                    ticks: { font: { size: 11, weight: '900' }, color: '#000' }
                },
                y: { 
                    grid: { display: false }, 
                    ticks: { 
                        font: { size: 13, weight: '900' }, 
                        color: '#333',
                        autoSkip: false
                    } 
                }
            }
        }
    });
}

function fitAll() {
    if (visibleMunicipalities.length === 0) return;
    let bounds = [];
    visibleMunicipalities.forEach(m => m.points.forEach(p => bounds.push([p.lat, p.lng])));
    if (bounds.length) {
        map.fitBounds(bounds, { padding: [50, 50] });
    }
}

// Initialize
initMap();
</script>
</body>
