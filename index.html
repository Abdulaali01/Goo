<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل البلديات - نهائي</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-simple-map-screenshoter@0.5.0/dist/leaflet-simple-map-screenshoter.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
}

.top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100000;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 3px solid #667eea;
}

.top-bar input, .top-bar select, .top-bar button {
    padding: 8px 14px;
    border-radius: 10px;
    border: 2px solid #e0e0e0;
    font-size: 13px;
}

.top-bar button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
}

.top-bar button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.btn-export {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important;
}

.main-container {
    margin-top: 80px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.map-wrapper {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    position: relative;
    height: 70vh;
    width: 100%;
}

#map {
    height: 100%;
    width: 100%;
}

.custom-zoom {
    position: absolute;
    bottom: 30px;
    right: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
    border: 2px solid #667eea;
}

.zoom-btn {
    width: 48px;
    height: 48px;
    border: none;
    background: white;
    font-size: 24px;
    cursor: pointer;
    color: #667eea;
    font-weight: bold;
    transition: all 0.3s;
}

.zoom-btn:hover {
    background: #667eea;
    color: white;
}

.zoom-btn:first-child {
    border-bottom: 1px solid #e0e0e0;
}

.stats-section {
    display: grid;
    grid-template-columns: 200px 1fr 1fr;
    gap: 20px;
}

/* NEW: Section for top 3 districts charts */
.districts-charts-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.district-chart-card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.district-chart-title {
    font-size: 14px;
    font-weight: 700;
    color: #333;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 3px solid #667eea;
    text-align: center;
}

.district-chart-container {
    position: relative;
    height: 250px;
    width: 100%;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 3px solid #667eea;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 10px;
    font-size: 13px;
}

.stat-value {
    font-weight: 700;
    color: #667eea;
    font-size: 16px;
}

.legend-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #f8f9fa;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 12px;
}

.legend-item:hover {
    background: #e9ecef;
    transform: translateX(-5px);
}

.legend-color-box {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    font-weight: bold;
}

.legend-text {
    flex: 1;
    text-align: right;
}

.legend-count {
    background: #333;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: bold;
}

.chart-container {
    position: relative;
    height: 300px;
    width: 100%;
}

.bar-chart-container {
    position: relative;
    height: 250px;
    width: 100%;
}

.map-label-container {
    background: rgba(255, 255, 255, 0.95);
    padding: 8px 14px;
    border-radius: 25px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    border: 3px solid;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    direction: rtl;
}

.map-label-name {
    color: #333;
}

.map-label-count {
    background: var(--district-color);
    color: white;
    padding: 3px 10px;
    border-radius: 15px;
    font-size: 13px;
    min-width: 28px;
    text-align: center;
}

/* أنماط التصدير */
.export-container {
    width: 1920px !important;
    height: 980px !important;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    display: grid !important;
    grid-template-columns: 680px 1fr !important;
    gap: 20px !important;
    padding: 20px !important;
    position: fixed !important;
    top: 100px !important;
    left: 0 !important;
    z-index: 999999 !important;
}

.export-left {
    display: flex !important;
    flex-direction: column !important;
    gap: 15px !important;
    height: 100% !important;
}

.export-top-row {
    display: grid !important;
    grid-template-columns: 220px 1fr !important;
    gap: 15px !important;
    height: 55% !important;
}

.export-legend {
    background: white;
    border-radius: 16px;
    padding: 15px;
    overflow: hidden;
}

.export-legend .card-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
    padding-bottom: 8px;
}

.export-chart-stats {
    background: white;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.export-chart-stats .card-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
    padding-bottom: 8px;
}

.export-chart-stats .chart-area {
    flex: 1;
    min-height: 180px;
    position: relative;
}

.export-chart-stats .stats-area {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 10px !important;
    margin-top: 10px !important;
    padding-top: 10px !important;
    border-top: 2px solid #e0e0e0 !important;
}

.export-chart-stats .stat-box {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.export-chart-stats .stat-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

.export-chart-stats .stat-value {
    font-size: 20px;
    font-weight: 800;
    color: #667eea;
}

.export-categories {
    height: 45% !important;
    background: white;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.export-categories .card-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
    padding-bottom: 8px;
}

.export-categories .chart-area {
    flex: 1;
    position: relative;
}

.export-map {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    height: 100% !important;
    width: 100% !important;
}

.export-map #mapExport {
    height: 100% !important;
    width: 100% !important;
}

.export-container .original-content {
    display: none !important;
}

.export-container ~ .top-bar,
.export-container ~ .custom-zoom {
    display: none !important;
}

body.exporting {
    overflow: hidden !important;
}

body.exporting .main-container:not(.export-container) {
    display: none !important;
}

@media (max-width: 1100px) {
    .stats-section {
        grid-template-columns: 1fr;
    }
    .districts-charts-section {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="top-bar">
    <input type="file" id="file" accept=".xlsx,.xls">
    <button onclick="loadExcel()">📁 رفع ملف Excel</button>

    <select id="municipalityFilter" onchange="applyCurrentFilter()">
        <option value="all">🏛️ كل البلديات</option>
    </select>

    <select id="dateFilter" onchange="applyCurrentFilter()">
        <option value="all">📅 كل الأشهر</option>
    </select>

    <select id="filterSelect" onchange="applyCurrentFilter()">
        <option value="all">📊 الكل</option>
        <option value="5">⭐ أعلى 5</option>
        <option value="10">⭐ أعلى 10</option>
    </select>

    <input id="searchBox" placeholder="🔍 بحث عن بلدية..." oninput="applyCurrentFilter()">

    <button onclick="fitAll()">🌍 إظهار الكل</button>
    <button class="btn-export" onclick="exportSlide()">📸 تصدير للبور بوينت</button>
    <button onclick="exportExcel()">📊 Excel</button>
    <button onclick="clearAllData()" style="background: #ff4757 !important;">🗑️ مسح</button>
</div>

<div class="main-container" id="captureArea">

    <div class="map-wrapper" id="mapSection">
        <div id="map"></div>

        <div class="custom-zoom">
            <button class="zoom-btn" onclick="map.zoomIn()">+</button>
            <button class="zoom-btn" onclick="map.zoomOut()">−</button>
        </div>
    </div>

    <div class="stats-section" id="statsSection">

        <div class="card">
            <div class="card-title">🎨 دليل الألوان</div>
            <div id="legendBox" class="legend-container"></div>
        </div>

        <div class="card">
            <div class="card-title">📊 توزيع البلاغات بالبلديات</div>
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📈 إحصائيات عامة</div>
            <div class="stat-item">
                <span>إجمالي البلاغات</span>
                <span class="stat-value" id="totalReports">0</span>
            </div>
            <div class="stat-item">
                <span>عدد البلديات</span>
                <span class="stat-value" id="totalDistricts">0</span>
            </div>
            <div class="stat-item">
                <span>الأعلى بلاغات</span>
                <span class="stat-value" id="topDistrict">-</span>
            </div>
        </div>

    </div>

    <!-- NEW SECTION: Top 3 Districts Charts for each Municipality -->
    <div id="topDistrictsSection" class="districts-charts-section">
        <!-- Charts will be dynamically inserted here -->
    </div>

    <div class="stats-section" id="categorySection">
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-title">📊 توزيع التصنيفات</div>
            <div class="bar-chart-container">
                <canvas id="chart2"></canvas>
            </div>
        </div>
    </div>

</div>

<script>
Chart.register(ChartDataLabels);

let map, screenshoter;
let polygons = [], labels = [];
let rawDistricts = [], visibleMunicipalities = [];
let chart = null, chart2 = null;
let exportRows = [];
let allMunicipalities = new Set();
let allDates = new Set();
let categoryData = {};
let districtCharts = {}; // Store references to district charts

const colors = [
    "#e74c3c", "#e67e22", "#f39c12", "#27ae60", "#16a085",
    "#2980b9", "#8e44ad", "#c0392b", "#2c3e50", "#7f8c8d",
    "#1abc9c", "#3498db", "#9b59b6", "#34495e", "#16a085"
];

function initMap() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
    }).setView([21.4, 40.4], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        crossOrigin: true
    }).addTo(map);

    screenshoter = L.simpleMapScreenshoter({
        screenName: 'خريطة_البلديات',
        hidden: true,
        hideElementsWithSelectors: ['.custom-zoom'],
        caption: function() {
            return 'تحليل البلديات - ' + new Date().toLocaleDateString('ar-SA');
        }
    }).addTo(map);
}

function loadExcel() {
    const file = document.getElementById("file").files[0];
    if (!file) { 
        alert('الرجاء اختيار ملف'); 
        return; 
    }

    const reader = new FileReader();
    reader.onload = e => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        processRows(rows);
    };
    reader.readAsArrayBuffer(file);
}

function processRows(rows) {
    let mapData = {}, total = 0;
    allMunicipalities.clear();
    allDates.clear();
    categoryData = {};

    // NEW: Store district data per municipality
    let municipalityDistricts = {};

    for (let i = 1; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length < 3) continue;

        let lng = parseFloat(r[0]);
        let lat = parseFloat(r[1]);
        let districtName = String(r[2] || "غير معروف").trim(); // This is actually the district
        let muni = String(r[3] || "غير محدد").trim(); // Municipality
        let date = String(r[4] || "غير معروف").trim();
        let category = String(r[5] || "غير محدد").trim();

        if (isNaN(lat) || isNaN(lng)) continue;

        total++;
        allMunicipalities.add(muni);
        allDates.add(date);

        if (!categoryData[category]) categoryData[category] = 0;
        categoryData[category]++;

        // NEW: Track districts per municipality
        if (!municipalityDistricts[muni]) {
            municipalityDistricts[muni] = {};
        }
        if (!municipalityDistricts[muni][districtName]) {
            municipalityDistricts[muni][districtName] = 0;
        }
        municipalityDistricts[muni][districtName]++;

        let key = muni + "||" + date + "||" + i;
        if (!mapData[key]) {
            mapData[key] = { municipality: muni, date, points: [], categories: new Set(), districts: new Set() };
        }
        mapData[key].points.push({ lat, lng });
        mapData[key].categories.add(category);
        mapData[key].districts.add(districtName);
    }

    // Store district data globally for chart generation
    window.municipalityDistrictsData = municipalityDistricts;

    fillSelect("municipalityFilter", allMunicipalities);
    fillSelect("dateFilter", allDates);

    // تجميع البيانات حسب البلدية فقط
    let mergedData = {};
    Object.values(mapData).forEach(d => {
        let mergeKey = d.municipality;
        if (!mergedData[mergeKey]) {
            mergedData[mergeKey] = { 
                municipality: d.municipality, 
                date: d.date, 
                points: [], 
                categories: new Set(),
                districts: new Set()
            };
        }

        d.points.forEach(p => {
            let isDuplicate = mergedData[mergeKey].points.some(existing => 
                Math.abs(existing.lat - p.lat) < 0.0001 && 
                Math.abs(existing.lng - p.lng) < 0.0001
            );
            if (!isDuplicate) {
                mergedData[mergeKey].points.push(p);
            }
        });

        d.categories.forEach(c => mergedData[mergeKey].categories.add(c));
        d.districts.forEach(dist => mergedData[mergeKey].districts.add(dist));
    });

    rawDistricts = Object.values(mergedData).map((d, i) => {
        let cLat = d.points.reduce((s, p) => s + p.lat, 0) / d.points.length;
        let cLng = d.points.reduce((s, p) => s + p.lng, 0) / d.points.length;

        return {
            ...d,
            count: d.points.length,
            centerLat: cLat,
            centerLng: cLng,
            color: colors[i % colors.length],
            uniqueId: i
        };
    }).sort((a, b) => b.count - a.count);

    document.getElementById("totalReports").textContent = total;
    document.getElementById("totalDistricts").textContent = rawDistricts.length;
    document.getElementById("topDistrict").textContent = rawDistricts[0]?.municipality || "-";

    applyCurrentFilter();
    showNotification(`✅ تم تحميل ${total} بلاغ من ${rawDistricts.length} بلدية`);
}

function fillSelect(id, set) {
    let el = document.getElementById(id);
    el.innerHTML = id === 'municipalityFilter' ? 
        '<option value="all">🏛️ كل البلديات</option>' : 
        '<option value="all">📅 كل الأشهر</option>';
    [...set].sort().forEach(v => { 
        el.innerHTML += `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`; 
    });
}

function applyCurrentFilter() {
    let muni = document.getElementById("municipalityFilter").value;
    let date = document.getElementById("dateFilter").value;
    let top = document.getElementById("filterSelect").value;
    let search = document.getElementById("searchBox").value.toLowerCase();

    let arr = rawDistricts.filter(d =>
        (muni === "all" || d.municipality === muni) &&
        (date === "all" || d.date === date) &&
        d.municipality.toLowerCase().includes(search)
    );

    if (top === "5") arr = arr.slice(0, 5);
    if (top === "10") arr = arr.slice(0, 10);

    visibleMunicipalities = arr;

    updateCategoryData();
    draw();
    drawCategoryChart();
    drawTopDistrictsCharts(); // NEW: Draw the top 3 districts charts
}

// NEW FUNCTION: Draw charts for top 3 districts per municipality
function drawTopDistrictsCharts() {
    const container = document.getElementById('topDistrictsSection');

    // Clear existing charts
    Object.values(districtCharts).forEach(chart => chart.destroy());
    districtCharts = {};
    container.innerHTML = '';

    if (!window.municipalityDistrictsData || visibleMunicipalities.length === 0) return;

    visibleMunicipalities.forEach((municipality, index) => {
        const muniName = municipality.municipality;
        const districts = window.municipalityDistrictsData[muniName];

        if (!districts) return;

        // Get top 3 districts
        const sortedDistricts = Object.entries(districts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3);

        if (sortedDistricts.length === 0) return;

        // Create card for this municipality
        const card = document.createElement('div');
        card.className = 'district-chart-card';
        card.innerHTML = `
            <div class="district-chart-title">🏘️ ${escapeHtml(muniName)} - أعلى 3 أحياء</div>
            <div class="district-chart-container">
                <canvas id="districtChart_${index}"></canvas>
            </div>
        `;
        container.appendChild(card);

        // Create chart
        const ctx = document.getElementById(`districtChart_${index}`).getContext('2d');
        const chartColors = [
            municipality.color,
            adjustColor(municipality.color, -20),
            adjustColor(municipality.color, -40)
        ];

        districtCharts[index] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sortedDistricts.map(d => d[0]),
                datasets: [{
                    label: 'عدد البلاغات',
                    data: sortedDistricts.map(d => d[1]),
                    backgroundColor: chartColors,
                    borderRadius: 8,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#333',
                        font: { weight: 'bold', size: 12 },
                        formatter: (value) => value
                    }
                },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { font: { size: 11, weight: 'bold' } }
                    },
                    x: { 
                        grid: { display: false }, 
                        ticks: { 
                            font: { size: 10, weight: 'bold' },
                            maxRotation: 30
                        } 
                    }
                }
            }
        });
    });
}

// Helper function to darken/lighten color
function adjustColor(color, amount) {
    return '#' + color.replace(/^#/, '').replace(/../g, color => ('0' + Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
}

function updateCategoryData() {
    categoryData = {};
    visibleMunicipalities.forEach(d => {
        d.categories.forEach(cat => {
            if (!categoryData[cat]) categoryData[cat] = 0;
            categoryData[cat]++;
        });
    });
}

function draw() {
    clearMapLayers();

    visibleMunicipalities.forEach((m) => {
        if (m.points.length >= 3) {
            let hull = convexHull(m.points);

            let poly = L.polygon(hull.map(p => [p.lat, p.lng]), {
                color: m.color,
                fillColor: m.color,
                fillOpacity: 0.25,
                weight: 4
            }).addTo(map);

            poly.on('mouseover', function() { this.setStyle({ fillOpacity: 0.45, weight: 6 }); });
            poly.on('mouseout', function() { this.setStyle({ fillOpacity: 0.25, weight: 4 }); });

            polygons.push(poly);
        } else if (m.points.length > 0) {
            let circle = L.circleMarker([m.centerLat, m.centerLng], {
                radius: 16,
                color: m.color,
                fillColor: m.color,
                fillOpacity: 0.35,
                weight: 4
            }).addTo(map);

            polygons.push(circle);
        }

function convexHull(points) {
    const pts = points.map(p => [p.lat, p.lng]);
    if (pts.length <= 3) return pts.map(p => ({ lat: p[0], lng: p[1] }));

    pts.sort((a, b) => a[0] === b[0] ? a[1] - b[1] : a[0] - b[0]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];

    for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
        lower.push(p);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
        upper.push(p);
    }
    upper.pop(); 
    lower.pop();
    return lower.concat(upper).map(p => ({ lat: p[0], lng: p[1] }));
}

function highlightMunicipality(uniqueId) {
    const municipality = visibleMunicipalities.find(m => String(m.uniqueId) === String(uniqueId));

    }
}

        exportRows.push([
            d.municipality,
            d.date,
            [...d.categories].join(", "),
            d.count
        ]);
    });
}

function exportExcel() {
    if (exportRows.length <= 1) {

    let ws = XLSX.utils.aoa_to_sheet(exportRows);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "البلديات");
    XLSX.writeFile(wb, "تحليل_البلديات.xlsx");
}

function fitAll() {
    if (visibleMunicipalities.length === 0) return;

    let bounds = [];
    visibleMunicipalities.forEach(m => m.points.forEach(p => bounds.push([p.lat, p.lng])));
    if (bounds.length) {
        map.fitBounds(bounds, { padding: [50, 50] });
    }
}

function clearMapLayers() {
    polygons.forEach(p => map.removeLayer(p));
    labels.forEach(l => map.removeLayer(l));
    polygons = [];
    labels = [];
}

function showNotification(message) {
    const notif = document.createElement('div');
    notif.style.cssText = `
        position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.85); color: white; padding: 15px 30px;
        border-radius: 30px; font-weight: 600; z-index: 100001;
        transition: opacity .3s ease;
    `;
    notif.textContent = message;
    document.body.appendChild(notif);
    setTimeout(() => { 
        notif.style.opacity = '0'; 
        setTimeout(() => notif.remove(), 300); 
    }, 3000);
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
