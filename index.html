<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل البلديات - HD</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

body {
    font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    line-height: 1.6;
}

/* تحسين وضوح الخطوط */
* {
    font-feature-settings: "kern" 1;
    font-kerning: normal;
}

.top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100000;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 3px solid #667eea;
}

.top-bar input, .top-bar select, .top-bar button {
    padding: 8px 14px;
    border-radius: 10px;
    border: 2px solid #e0e0e0;
    font-size: 13px;
    font-family: inherit;
}

.top-bar button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
}

.top-bar button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.btn-export {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important;
}

.main-container {
    margin-top: 80px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 1920px;
    margin-left: auto;
    margin-right: auto;
}

.map-wrapper {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    position: relative;
    height: 70vh;
    width: 100%;
}

#map {
    height: 100%;
    width: 100%;
}

.custom-zoom {
    position: absolute;
    bottom: 30px;
    right: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
    border: 2px solid #667eea;
}

.zoom-btn {
    width: 48px;
    height: 48px;
    border: none;
    background: white;
    font-size: 24px;
    cursor: pointer;
    color: #667eea;
    font-weight: bold;
    transition: all 0.3s;
}

.zoom-btn:hover {
    background: #667eea;
    color: white;
}

.zoom-btn:first-child {
    border-bottom: 1px solid #e0e0e0;
}

.stats-section {
    display: grid;
    grid-template-columns: 220px 1fr 280px;
    gap: 20px;
}

/* شبكة المخططات لكل بلدية - 4 في الصف */
.all-districts-grid {
    grid-column: 1 / -1;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.all-districts-title {
    font-size: 22px;
    font-weight: 900;
    color: #333;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 3px solid #667eea;
    text-align: center;
    letter-spacing: -0.5px;
}

.districts-grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.mini-chart-box {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 20px;
    border: 2px solid #e9ecef;
    transition: transform 0.3s, box-shadow 0.3s;
}

.mini-chart-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.mini-chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #dee2e6;
}

.mini-chart-color {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    flex-shrink: 0;
}

.mini-chart-name {
    font-size: 15px;
    font-weight: 800;
    color: #222;
    flex: 1;
    text-align: right;
    margin-right: 12px;
    line-height: 1.4;
}

.mini-chart-wrapper {
    position: relative;
    height: 180px;
    width: 100%;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.card-title {
    font-size: 18px;
    font-weight: 800;
    color: #222;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 3px solid #667eea;
    letter-spacing: -0.3px;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
}

.stat-value {
    font-weight: 900;
    color: #667eea;
    font-size: 20px;
}

.legend-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #f8f9fa;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 14px;
    font-weight: 600;
}

.legend-item:hover {
    background: #e9ecef;
    transform: translateX(-5px);
}

.legend-color-box {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-weight: 900;
}

.legend-text {
    flex: 1;
    text-align: right;
    font-weight: 700;
}

.legend-count {
    background: #333;
    color: white;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 900;
}

.chart-container {
    position: relative;
    height: 320px;
    width: 100%;
}

.bar-chart-container {
    position: relative;
    height: 280px;
    width: 100%;
}

.map-label-container {
    background: rgba(255, 255, 255, 0.98);
    padding: 10px 16px;
    border-radius: 25px;
    font-weight: 800;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    border: 3px solid;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    direction: rtl;
    font-family: inherit;
}

.map-label-count {
    background: var(--district-color);
    color: white;
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 14px;
    min-width: 32px;
    text-align: center;
    font-weight: 900;
}

/* تحسينات للشاشات الصغيرة */
@media (max-width: 1400px) {
    .districts-grid-container {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 1100px) {
    .districts-grid-container {
        grid-template-columns: repeat(2, 1fr);
    }
    .stats-section {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 768px) {
    .districts-grid-container {
        grid-template-columns: 1fr;
    }
    .stats-section {
        grid-template-columns: 1fr;
    }
    .main-container {
        padding: 10px;
    }
}

/* تحسين وضوح Canvas */
canvas {
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
}
</style>
</head>

<body>

<div class="top-bar">
    <input type="file" id="file" accept=".xlsx,.xls">
    <button onclick="loadExcel()">📁 رفع ملف Excel</button>

    <select id="municipalityFilter" onchange="applyCurrentFilter()">
        <option value="all">🏛️ كل البلديات</option>
    </select>

    <select id="dateFilter" onchange="applyCurrentFilter()">
        <option value="all">📅 كل الأشهر</option>
    </select>

    <select id="filterSelect" onchange="applyCurrentFilter()">
        <option value="all">📊 الكل</option>
        <option value="5">⭐ أعلى 5</option>
        <option value="10">⭐ أعلى 10</option>
    </select>

    <input id="searchBox" placeholder="🔍 بحث عن بلدية..." oninput="applyCurrentFilter()">

    <button onclick="fitAll()">🌍 إظهار الكل</button>
    <button class="btn-export" onclick="exportDashboard()">📸 تصدير HD</button>
    <button onclick="exportExcel()">📊 Excel</button>
    <button onclick="clearAllData()" style="background: #ff4757 !important;">🗑️ مسح</button>
</div>

<div class="main-container" id="captureArea">

    <div class="map-wrapper" id="mapSection">
        <div id="map"></div>
        <div class="custom-zoom">
            <button class="zoom-btn" onclick="map.zoomIn()">+</button>
            <button class="zoom-btn" onclick="map.zoomOut()">−</button>
        </div>
    </div>

    <div class="stats-section" id="statsSection">
        <div class="card">
            <div class="card-title">🎨 دليل الألوان</div>
            <div id="legendBox" class="legend-container"></div>
        </div>

        <div class="card">
            <div class="card-title">📊 توزيع البلاغات بالبلديات</div>
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📈 إحصائيات عامة</div>
            <div class="stat-item">
                <span>إجمالي البلاغات</span>
                <span class="stat-value" id="totalReports">0</span>
            </div>
            <div class="stat-item">
                <span>عدد البلديات</span>
                <span class="stat-value" id="totalDistricts">0</span>
            </div>
            <div class="stat-item">
                <span>الأعلى بلاغات</span>
                <span class="stat-value" id="topDistrict">-</span>
            </div>
        </div>
    </div>

    <!-- شبكة المخططات لكل البلديات -->
    <div class="all-districts-grid" id="allDistrictsGrid" style="display: none;">
        <div class="all-districts-title">🏘️ أعلى 3 أحياء لكل بلدية</div>
        <div class="districts-grid-container" id="districtsGridContainer"></div>
    </div>

    <div class="stats-section" id="categorySection">
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-title">📊 توزيع التصنيفات</div>
            <div class="bar-chart-container">
                <canvas id="chart2"></canvas>
            </div>
        </div>
    </div>

</div>

<script>
Chart.register(ChartDataLabels);

let map;
let polygons = [], labels = [];
let rawDistricts = [], visibleMunicipalities = [];
let chart = null, chart2 = null;
let exportRows = [];
let allMunicipalities = new Set();
let allDates = new Set();
let categoryData = {};
let miniCharts = {};

const colors = [
    "#e74c3c", "#e67e22", "#f39c12", "#27ae60", "#16a085",
    "#2980b9", "#8e44ad", "#c0392b", "#2c3e50", "#7f8c8d",
    "#1abc9c", "#3498db", "#9b59b6", "#34495e", "#16a085"
];

function initMap() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
    }).setView([21.4, 40.4], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        crossOrigin: true
    }).addTo(map);
}

function loadExcel() {
    const file = document.getElementById("file").files[0];
    if (!file) { 
        alert('الرجاء اختيار ملف'); 
        return; 
    }

    const reader = new FileReader();
    reader.onload = e => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        processRows(rows);
    };
    reader.readAsArrayBuffer(file);
}

function processRows(rows) {
    let mapData = {}, total = 0;
    allMunicipalities.clear();
    allDates.clear();
    categoryData = {};
    let municipalityDistricts = {};

    for (let i = 1; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length < 3) continue;

        let lng = parseFloat(r[0]);
        let lat = parseFloat(r[1]);
        let districtName = String(r[2] || "غير معروف").trim();
        let muni = String(r[3] || "غير محدد").trim();
        let date = String(r[4] || "غير معروف").trim();
        let category = String(r[5] || "غير محدد").trim();

        if (isNaN(lat) || isNaN(lng)) continue;

        total++;
        allMunicipalities.add(muni);
        allDates.add(date);

        if (!categoryData[category]) categoryData[category] = 0;
        categoryData[category]++;

        if (!municipalityDistricts[muni]) {
            municipalityDistricts[muni] = {};
        }
        if (!municipalityDistricts[muni][districtName]) {
            municipalityDistricts[muni][districtName] = 0;
        }
        municipalityDistricts[muni][districtName]++;

        let key = muni + "||" + date + "||" + i;
        if (!mapData[key]) {
            mapData[key] = { municipality: muni, date, points: [], categories: new Set(), districts: new Set() };
        }
        mapData[key].points.push({ lat, lng });
        mapData[key].categories.add(category);
        mapData[key].districts.add(districtName);
    }

    window.municipalityDistrictsData = municipalityDistricts;

    fillSelect("municipalityFilter", allMunicipalities);
    fillSelect("dateFilter", allDates);

    let mergedData = {};
    Object.values(mapData).forEach(d => {
        let mergeKey = d.municipality;
        if (!mergedData[mergeKey]) {
            mergedData[mergeKey] = { 
                municipality: d.municipality, 
                date: d.date, 
                points: [], 
                categories: new Set(),
                districts: new Set()
            };
        }

        d.points.forEach(p => {
            let isDuplicate = mergedData[mergeKey].points.some(existing => 
                Math.abs(existing.lat - p.lat) < 0.0001 && 
                Math.abs(existing.lng - p.lng) < 0.0001
            );
            if (!isDuplicate) {
                mergedData[mergeKey].points.push(p);
            }
        });

        d.categories.forEach(c => mergedData[mergeKey].categories.add(c));
        d.districts.forEach(dist => mergedData[mergeKey].districts.add(dist));
    });

    rawDistricts = Object.values(mergedData).map((d, i) => {
        let cLat = d.points.reduce((s, p) => s + p.lat, 0) / d.points.length;
        let cLng = d.points.reduce((s, p) => s + p.lng, 0) / d.points.length;

        return {
            ...d,
            count: d.points.length,
            centerLat: cLat,
            centerLng: cLng,
            color: colors[i % colors.length],
            uniqueId: i
        };
    }).sort((a, b) => b.count - a.count);

    document.getElementById("totalReports").textContent = total.toLocaleString();
    document.getElementById("totalDistricts").textContent = rawDistricts.length;
    document.getElementById("topDistrict").textContent = rawDistricts[0]?.municipality || "-";

    applyCurrentFilter();
    showNotification(`✅ تم تحميل ${total.toLocaleString()} بلاغ من ${rawDistricts.length} بلدية`);
}

function fillSelect(id, set) {
    let el = document.getElementById(id);
    el.innerHTML = id === 'municipalityFilter' ? 
        '<option value="all">🏛️ كل البلديات</option>' : 
        '<option value="all">📅 كل الأشهر</option>';
    [...set].sort().forEach(v => { 
        el.innerHTML += `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`; 
    });
}

function applyCurrentFilter() {
    let muni = document.getElementById("municipalityFilter").value;
    let date = document.getElementById("dateFilter").value;
    let top = document.getElementById("filterSelect").value;
    let search = document.getElementById("searchBox").value.toLowerCase();

    let arr = rawDistricts.filter(d =>
        (muni === "all" || d.municipality === muni) &&
        (date === "all" || d.date === date) &&
        d.municipality.toLowerCase().includes(search)
    );

    if (top === "5") arr = arr.slice(0, 5);
    if (top === "10") arr = arr.slice(0, 10);

    visibleMunicipalities = arr;

    updateCategoryData();
    draw();
    drawCategoryChart();
    drawAllDistrictsCharts();
}

function drawAllDistrictsCharts() {
    const container = document.getElementById('districtsGridContainer');
    const section = document.getElementById('allDistrictsGrid');

    Object.values(miniCharts).forEach(chart => chart.destroy());
    miniCharts = {};
    container.innerHTML = '';

    if (!window.municipalityDistrictsData || visibleMunicipalities.length === 0) {
        section.style.display = 'none';
        return;
    }

    section.style.display = 'block';

    visibleMunicipalities.forEach((municipality, index) => {
        const muniName = municipality.municipality;
        const districts = window.municipalityDistrictsData[muniName];

        if (!districts) return;

        const sortedDistricts = Object.entries(districts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3);

        if (sortedDistricts.length === 0) return;

        const chartBox = document.createElement('div');
        chartBox.className = 'mini-chart-box';
        chartBox.innerHTML = `
            <div class="mini-chart-header">
                <div class="mini-chart-color" style="background: ${municipality.color}"></div>
                <div class="mini-chart-name">${escapeHtml(muniName)}</div>
            </div>
            <div class="mini-chart-wrapper">
                <canvas id="districtChart_${index}"></canvas>
            </div>
        `;
        container.appendChild(chartBox);

        const ctx = document.getElementById(`districtChart_${index}`).getContext('2d');
        const baseColor = municipality.color;

        // ألوان متدرجة أوضح
        const chartColors = [
            baseColor,
            adjustColor(baseColor, -50),
            adjustColor(baseColor, -100)
        ];

        miniCharts[index] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sortedDistricts.map(d => d[0]),
                datasets: [{
                    data: sortedDistricts.map(d => d[1]),
                    backgroundColor: chartColors,
                    borderRadius: 10,
                    borderSkipped: false,
                    borderWidth: 2,
                    borderColor: adjustColor(baseColor, -120)
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 1000,
                    easing: 'easeOutQuart'
                },
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#222',
                        font: { 
                            weight: '900', 
                            size: 16,
                            family: 'Segoe UI'
                        },
                        formatter: (value) => value,
                        offset: 5
                    },
                    tooltip: {
                        backgroundColor: baseColor,
                        titleFont: { size: 14, weight: 'bold', family: 'Segoe UI' },
                        bodyFont: { size: 13, family: 'Segoe UI' },
                        padding: 12,
                        cornerRadius: 10,
                        displayColors: false
                    }
                },
                scales: {
                    y: { 
                        beginAtZero: true,
                        grid: { 
                            color: 'rgba(0,0,0,0.08)',
                            drawBorder: false
                        },
                        ticks: { 
                            font: { 
                                size: 12, 
                                weight: '700',
                                family: 'Segoe UI'
                            }, 
                            color: '#444',
                            maxTicksLimit: 6,
                            padding: 8
                        },
                        border: { display: false }
                    },
                    x: { 
                        grid: { display: false }, 
                        ticks: { 
                            font: { 
                                size: 13, 
                                weight: '800',
                                family: 'Segoe UI'
                            }, 
                            color: '#222',
                            maxRotation: 0,
                            autoSkip: false,
                            padding: 10
                        },
                        border: { display: false }
                    }
                },
                layout: {
                    padding: {
                        top: 25,
                        right: 10,
                        left: 10,
                        bottom: 5
                    }
                }
            }
        });
    });
}

function adjustColor(color, amount) {
    return '#' + color.replace(/^#/, '').replace(/../g, color => ('0' + Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
}

function updateCategoryData() {
    categoryData = {};
    visibleMunicipalities.forEach(d => {
        d.categories.forEach(cat => {
            if (!categoryData[cat]) categoryData[cat] = 0;
            categoryData[cat]++;
        });
    });
}

function draw() {
    clearMapLayers();

    visibleMunicipalities.forEach((m) => {
        if (m.points.length >= 3) {
            let hull = convexHull(m.points);
            let poly = L.polygon(hull.map(p => [p.lat, p.lng]), {
                color: m.color,
                fillColor: m.color,
                fillOpacity: 0.25,
                weight: 4
            }).addTo(map);
            poly.on('mouseover', function() { this.setStyle({ fillOpacity: 0.45, weight: 6 }); });
            poly.on('mouseout', function() { this.setStyle({ fillOpacity: 0.25, weight: 4 }); });
            polygons.push(poly);
        } else if (m.points.length > 0) {
            let circle = L.circleMarker([m.centerLat, m.centerLng], {
                radius: 16,
                color: m.color,
                fillColor: m.color,
                fillOpacity: 0.35,
                weight: 4
            }).addTo(map);
            polygons.push(circle);
        }

        let label = L.marker([m.centerLat, m.centerLng], {
            icon: L.divIcon({
                className: 'custom-label',
                html: `<div class="map-label-container" style="--district-color: ${m.color}; border-color: ${m.color};">
                    <span class="map-label-count">${m.count}</span>
                </div>`,
                iconSize: null,
                iconAnchor: [20, 20]
            })
        }).addTo(map);
        labels.push(label);
    });

    drawChart();
    buildLegend();

function convexHull(points) {
    const pts = points.map(p => [p.lat, p.lng]);
    if (pts.length <= 3) return pts.map(p => ({ lat: p[0], lng: p[1] }));

    pts.sort((a, b) => a[0] === b[0] ? a[1] - b[1] : a[0] - b[0]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];

    for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
        lower.push(p);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
        upper.push(p);
    }
    upper.pop(); 
    lower.pop();
    return lower.concat(upper).map(p => ({ lat: p[0], lng: p[1] }));
}

function buildLegend() {
    const container = document.getElementById("legendBox");
    container.innerHTML = visibleMunicipalities.slice(0, 10).map((m, index) => `
        <div class="legend-item" onclick="highlightMunicipality('${m.uniqueId}')" title="${escapeHtml(m.municipality)}">
            <div class="legend-color-box" style="background: ${m.color};">${index + 1}</div>
            <span class="legend-text">${escapeHtml(m.municipality)}</span>
            <span class="legend-count">${m.count}</span>
        </div>
    `).join("");
}

function highlightMunicipality(uniqueId) {
    const municipality = visibleMunicipalities.find(m => String(m.uniqueId) === String(uniqueId));
    if (municipality) {
        map.flyTo([municipality.centerLat, municipality.centerLng], 13, { duration: 1.5 });
    }
}

function buildExport() {
    exportRows = [["البلدية", "التاريخ", "التصنيف", "عدد البلاغات"]];
    visibleMunicipalities.forEach(d => {
        exportRows.push([
            d.municipality,
            d.date,
            [...d.categories].join(", "),
            d.count
        ]);
    });
}

function exportExcel() {
    if (exportRows.length <= 1) { 
        alert('لا توجد بيانات'); 
        return; 
    }
    let ws = XLSX.utils.aoa_to_sheet(exportRows);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "البلديات");
    XLSX.writeFile(wb, "تحليل_البلديات.xlsx");
}

function clearMapLayers() {
    polygons.forEach(p => map.removeLayer(p));
    labels.forEach(l => map.removeLayer(l));
    polygons = [];
    labels = [];
}

function clearAllData() {
    if (confirm('هل أنت متأكد؟')) location.reload();
}

function showNotification(message) {
    const notif = document.createElement('div');
    notif.style.cssText = `
        position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.9); color: white; padding: 18px 35px;
        border-radius: 30px; font-weight: 700; z-index: 100001;
        transition: opacity .3s ease; font-size: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    `;
    notif.textContent = message;
    document.body.appendChild(notif);
    setTimeout(() => { 
        notif.style.opacity = '0'; 
        setTimeout(() => notif.remove(), 300); 
    }, 3000);
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function fitAll() {
    if (visibleMunicipalities.length === 0) return;
    let bounds = [];
    visibleMunicipalities.forEach(m => m.points.forEach(p => bounds.push([p.lat, p.lng])));
    if (bounds.length) {
        map.fitBounds(bounds, { padding: [50, 50] });
    }
}

async function exportDashboard() {
    showNotification('⏳ جاري التصدير بجودة عالية...');

    try {
        const canvas = await html2canvas(document.getElementById('captureArea'), {
            scale: 3,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#667eea',
            logging: false,
            imageTimeout: 0,
            onclone: function(clonedDoc) {
                clonedDoc.body.style.fontFamily = 'Segoe UI, Tahoma, Arial, sans-serif';
            }
        });

        canvas.toBlob(blob => {
            saveAs(blob, `تقرير_البلديات_${new Date().toLocaleDateString('ar-SA')}.png`);
            showNotification('✅ تم التصدير بنجاح بجودة HD!');
        }, 'image/png');
    } catch (err) {
        alert('حدث خطأ: ' + err.message);
    }
}
