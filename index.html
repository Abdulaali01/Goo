<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل البلديات - نهائي</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-simple-map-screenshoter@0.5.0/dist/leaflet-simple-map-screenshoter.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
}

.top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100000;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 3px solid #667eea;
}

.top-bar input, .top-bar select, .top-bar button {
    padding: 8px 14px;
    border-radius: 10px;
    border: 2px solid #e0e0e0;
    font-size: 13px;
}

.top-bar button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
}

.top-bar button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.btn-export {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important;
}

/* ✅ تخطيط جديد: شريط جانبي + خريطة */
.main-layout {
    margin-top: 80px;
    display: flex;
    height: calc(100vh - 80px);
    gap: 20px;
    padding: 20px;
}

/* ✅ الشريط الجانبي (اليسار) - قائمة الرسوم البيانية */
.sidebar-charts {
    width: 400px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-height: calc(100vh - 100px);
}

.sidebar-title {
    color: white;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    padding: 15px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    margin-bottom: 10px;
}

/* ✅ بطاقة رسم بياني في الشريط الجانبي */
.chart-card {
    background: white;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    transition: transform 0.3s, box-shadow 0.3s;
    flex-shrink: 0;
}

.chart-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
}

.chart-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e0e0e0;
}

.chart-color {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
}

.chart-title {
    font-size: 14px;
    font-weight: 800;
    color: #333;
    flex: 1;
}

.chart-count {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
}

.chart-container-small {
    position: relative;
    height: 180px;
    width: 100%;
}

/* ✅ منطقة الخريطة (اليمين) */
.map-section {
    flex: 1;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    position: relative;
}

#map {
    height: 100%;
    width: 100%;
}

.custom-zoom {
    position: absolute;
    bottom: 30px;
    right: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
    border: 2px solid #667eea;
}

.zoom-btn {
    width: 48px;
    height: 48px;
    border: none;
    background: white;
    font-size: 24px;
    cursor: pointer;
    color: #667eea;
    font-weight: bold;
    transition: all 0.3s;
}

.zoom-btn:hover {
    background: #667eea;
    color: white;
}

.zoom-btn:first-child {
    border-bottom: 1px solid #e0e0e0;
}

/* ✅ الوسم على الخريطة - اسم البلدية فقط بدون رقم */
.map-label-container {
    background: rgba(255, 255, 255, 0.95);
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    border: 2px solid;
    font-size: 13px;
    direction: rtl;
    color: #333;
}

/* أنماط التصدير */
.export-container {
    width: 1920px !important;
    height: 980px !important;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    display: grid !important;
    grid-template-columns: 680px 1fr !important;
    gap: 20px !important;
    padding: 20px !important;
    position: fixed !important;
    top: 100px !important;
    left: 0 !important;
    z-index: 999999 !important;
}

.export-left {
    display: flex !important;
    flex-direction: column !important;
    gap: 15px !important;
    height: 100% !important;
}

.export-top-row {
    display: grid !important;
    grid-template-columns: 220px 1fr !important;
    gap: 15px !important;
    height: 55% !important;
}

.export-legend {
    background: white;
    border-radius: 16px;
    padding: 15px;
    overflow: hidden;
}

.export-legend .card-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
    padding-bottom: 8px;
}

.export-chart-stats {
    background: white;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.export-chart-stats .card-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
    padding-bottom: 8px;
}

.export-chart-stats .chart-area {
    flex: 1;
    min-height: 180px;
    position: relative;
}

.export-chart-stats .stats-area {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 10px !important;
    margin-top: 10px !important;
    padding-top: 10px !important;
    border-top: 2px solid #e0e0e0 !important;
}

.export-chart-stats .stat-box {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.export-chart-stats .stat-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

.export-chart-stats .stat-value {
    font-size: 20px;
    font-weight: 800;
    color: #667eea;
}

.export-categories {
    height: 45% !important;
    background: white;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.export-categories .card-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
    padding-bottom: 8px;
}

.export-categories .chart-area {
    flex: 1;
    position: relative;
}

.export-map {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    height: 100% !important;
    width: 100% !important;
}

.export-map #mapExport {
    height: 100% !important;
    width: 100% !important;
}

.export-container .original-content {
    display: none !important;
}

.export-container ~ .top-bar,
.export-container ~ .custom-zoom {
    display: none !important;
}

body.exporting {
    overflow: hidden !important;
}

body.exporting .main-layout {
    display: none !important;
}

@media (max-width: 1100px) {
    .main-layout {
        flex-direction: column;
    }
    
    .sidebar-charts {
        width: 100%;
        max-height: 400px;
    }
    
    .map-section {
        height: 500px;
    }
}
</style>
</head>

<body>

<div class="top-bar">
    <input type="file" id="file" accept=".xlsx,.xls">
    <button onclick="loadExcel()">📁 رفع ملف Excel</button>

    <select id="municipalityFilter" onchange="applyCurrentFilter()">
        <option value="all">🏛️ كل البلديات</option>
    </select>

    <select id="dateFilter" onchange="applyCurrentFilter()">
        <option value="all">📅 كل الأشهر</option>
    </select>

    <select id="filterSelect" onchange="applyCurrentFilter()">
        <option value="all">📊 الكل</option>
        <option value="5">⭐ أعلى 5</option>
        <option value="10">⭐ أعلى 10</option>
    </select>

    <input id="searchBox" placeholder="🔍 بحث عن بلدية..." oninput="applyCurrentFilter()">

    <button onclick="fitAll()">🌍 إظهار الكل</button>
    <button class="btn-export" onclick="exportSlide()">📸 تصدير للبور بوينت</button>
    <button onclick="exportExcel()">📊 Excel</button>
    <button onclick="clearAllData()" style="background: #ff4757 !important;">🗑️ مسح</button>
</div>

<!-- ✅ تخطيط جديد: شريط جانبي + خريطة -->
<div class="main-layout" id="mainLayout">

    <!-- ✅ الشريط الجانبي (اليسار) - قائمة الرسوم البيانية -->
    <div class="sidebar-charts" id="sidebarCharts">
        <div class="sidebar-title">📊 تحليل الأحياء</div>
        <!-- سيتم إضافة البطاقات هنا ديناميكياً -->
    </div>

    <!-- ✅ منطقة الخريطة (اليمين) -->
    <div class="map-section" id="mapSection">
        <div id="map"></div>

        <div class="custom-zoom">
            <button class="zoom-btn" onclick="map.zoomIn()">+</button>
            <button class="zoom-btn" onclick="map.zoomOut()">−</button>
        </div>
    </div>

</div>

<script>
Chart.register(ChartDataLabels);

let map, screenshoter;
let polygons = [], labels = [];
let rawDistricts = [], visibleMunicipalities = [];
let sidebarCharts = {}; // ✅ لتخزين رسوم الشريط الجانبي
let exportRows = [];
let allMunicipalities = new Set();
let allDates = new Set();
let categoryData = {};
let rawData = {}; // ✅ لتخزين بيانات الأحياء

const colors = [
    "#e74c3c", "#e67e22", "#f39c12", "#27ae60", "#16a085",
    "#2980b9", "#8e44ad", "#c0392b", "#2c3e50", "#7f8c8d",
    "#1abc9c", "#3498db", "#9b59b6", "#34495e", "#16a085"
];

function initMap() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
    }).setView([21.4, 40.4], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        crossOrigin: true
    }).addTo(map);

    screenshoter = L.simpleMapScreenshoter({
        screenName: 'خريطة_البلديات',
        hidden: true,
        hideElementsWithSelectors: ['.custom-zoom'],
        caption: function() {
            return 'تحليل البلديات - ' + new Date().toLocaleDateString('ar-SA');
        }
    }).addTo(map);
}

function loadExcel() {
    const file = document.getElementById("file").files[0];
    if (!file) { 
        alert('الرجاء اختيار ملف'); 
        return; 
    }

    const reader = new FileReader();
    reader.onload = e => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        processRows(rows);
    };
    reader.readAsArrayBuffer(file);
}

function processRows(rows) {
    let mapData = {}, total = 0;
    allMunicipalities.clear();
    allDates.clear();
    categoryData = {};
    rawData = {}; // ✅ إعادة تعيين

    for (let i = 1; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length < 3) continue;

        let lng = parseFloat(r[0]);
        let lat = parseFloat(r[1]);
        let districtName = String(r[2] || "غير معروف").trim(); // ✅ اسم الحي
        let muni = String(r[3] || "غير محدد").trim();
        let date = String(r[4] || "غير معروف").trim();
        let category = String(r[5] || "غير محدد").trim();

        if (isNaN(lat) || isNaN(lng)) continue;

        total++;
        allMunicipalities.add(muni);
        allDates.add(date);

        if (!categoryData[category]) categoryData[category] = 0;
        categoryData[category]++;

        // ✅ تجميع البيانات حسب البلدية والحي
        if (!rawData[muni]) {
            rawData[muni] = {};
        }
        if (!rawData[muni][districtName]) {
            rawData[muni][districtName] = {
                name: districtName,
                count: 0,
                points: [],
                categories: new Set()
            };
        }
        rawData[muni][districtName].count++;
        rawData[muni][districtName].points.push({ lat, lng });
        rawData[muni][districtName].categories.add(category);

        let key = muni + "||" + date + "||" + i;
        if (!mapData[key]) {
            mapData[key] = { municipality: muni, date, points: [], categories: new Set() };
        }
        mapData[key].points.push({ lat, lng });
        mapData[key].categories.add(category);
    }

    fillSelect("municipalityFilter", allMunicipalities);
    fillSelect("dateFilter", allDates);

    // تجميع البيانات حسب البلدية فقط
    let mergedData = {};
    Object.values(mapData).forEach(d => {
        let mergeKey = d.municipality;
        if (!mergedData[mergeKey]) {
            mergedData[mergeKey] = { 
                municipality: d.municipality, 
                date: d.date, 
                points: [], 
                categories: new Set() 
            };
        }

        d.points.forEach(p => {
            let isDuplicate = mergedData[mergeKey].points.some(existing => 
                Math.abs(existing.lat - p.lat) < 0.0001 && 
                Math.abs(existing.lng - p.lng) < 0.0001
            );
            if (!isDuplicate) {
                mergedData[mergeKey].points.push(p);
            }
        });

        d.categories.forEach(c => mergedData[mergeKey].categories.add(c));
    });

    rawDistricts = Object.values(mergedData).map((d, i) => {
        let cLat = d.points.reduce((s, p) => s + p.lat, 0) / d.points.length;
        let cLng = d.points.reduce((s, p) => s + p.lng, 0) / d.points.length;

        return {
            ...d,
            count: d.points.length,
            centerLat: cLat,
            centerLng: cLng,
            color: colors[i % colors.length],
            uniqueId: i
        };
    }).sort((a, b) => b.count - a.count);

    document.getElementById("totalReports").textContent = total;
    document.getElementById("totalDistricts").textContent = rawDistricts.length;
    document.getElementById("topDistrict").textContent = rawDistricts[0]?.municipality || "-";

    applyCurrentFilter();
    showNotification(`✅ تم تحميل ${total} بلاغ من ${rawDistricts.length} بلدية`);
}

function fillSelect(id, set) {
    let el = document.getElementById(id);
    el.innerHTML = id === 'municipalityFilter' ? 
        '<option value="all">🏛️ كل البلديات</option>' : 
        '<option value="all">📅 كل الأشهر</option>';
    [...set].sort().forEach(v => { 
        el.innerHTML += `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`; 
    });
}

function applyCurrentFilter() {
    let muni = document.getElementById("municipalityFilter").value;
    let date = document.getElementById("dateFilter").value;
    let top = document.getElementById("filterSelect").value;
    let search = document.getElementById("searchBox").value.toLowerCase();

    let arr = rawDistricts.filter(d =>
        (muni === "all" || d.municipality === muni) &&
        (date === "all" || d.date === date) &&
        d.municipality.toLowerCase().includes(search)
    );

    if (top === "5") arr = arr.slice(0, 5);
    if (top === "10") arr = arr.slice(0, 10);

    visibleMunicipalities = arr;

    updateCategoryData();
    draw();
    drawSidebarCharts(); // ✅ رسم رسوم الشريط الجانبي
}

function updateCategoryData() {
    categoryData = {};
    visibleMunicipalities.forEach(d => {
        d.categories.forEach(cat => {
            if (!categoryData[cat]) categoryData[cat] = 0;
            categoryData[cat]++;
        });
    });
}

// ✅ دالة جديدة: رسم رسوم بيانية في الشريط الجانبي
function drawSidebarCharts() {
    // تدمير الرسوم السابقة
    Object.values(sidebarCharts).forEach(c => c.destroy());
    sidebarCharts = {};
    
    const container = document.getElementById('sidebarCharts');
    // إبقاء العنوان فقط
    container.innerHTML = '<div class="sidebar-title">📊 تحليل الأحياء</div>';

    visibleMunicipalities.forEach((municipality) => {
        const districts = rawData[municipality.municipality];
        if (!districts) return;

        // تحويل الأحياء إلى مصفوفة وترتيبها (أعلى 5)
        const districtsArray = Object.values(districts)
            .sort((a, b) => b.count - a.count)
            .slice(0, 5);

        if (districtsArray.length === 0) return;

        const canvasId = `sidebar-chart-${municipality.uniqueId}`;
        
        // إنشاء بطاقة الرسم
        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML = `
            <div class="chart-header">
                <div class="chart-color" style="background: ${municipality.color}"></div>
                <div class="chart-title">${escapeHtml(municipality.municipality)}</div>
                <div class="chart-count">${municipality.count}</div>
            </div>
            <div class="chart-container-small">
                <canvas id="${canvasId}"></canvas>
            </div>
        `;
        container.appendChild(card);

        // رسم الرسم البياني
        setTimeout(() => {
            drawSidebarChart(canvasId, districtsArray, municipality.color);
        }, 50);
    });
}

// ✅ دالة رسم رسم بياني في الشريط الجانبي
function drawSidebarChart(canvasId, districtsArray, baseColor) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    
    // إنشاء ألوان متدرجة
    const backgroundColors = districtsArray.map((_, i) => {
        const opacity = 1 - (i * 0.15);
        return hexToRgba(baseColor, opacity);
    });

    sidebarCharts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: districtsArray.map(d => d.name.substring(0, 10)), // اختصار الأسماء
            datasets: [{
                label: 'البلاغات',
                data: districtsArray.map(d => d.count),
                backgroundColor: backgroundColors,
                borderRadius: 6,
                borderSkipped: false,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
                legend: { display: false },
                datalabels: {
                    display: true,
                    anchor: 'end',
                    align: 'top',
                    color: '#333',
                    font: { weight: 'bold', size: 10 },
                    formatter: (value) => value
                },
                tooltip: {
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    titleFont: { size: 12 },
                    bodyFont: { size: 11 },
                    padding: 8,
                    cornerRadius: 6,
                    displayColors: false,
                    callbacks: {
                        title: function(context) {
                            return districtsArray[context[0].dataIndex].name;
                        },
                        label: function(context) {
                            return `البلاغات: ${context.parsed.y}`;
                        }
                    }
                }
            },
            scales: {
                y: { 
                    beginAtZero: true, 
                    grid: { color: 'rgba(0,0,0,0.05)' },
                    ticks: { 
                        font: { size: 9, weight: 'bold' },
                        stepSize: 1
                    }
                },
                x: { 
                    grid: { display: false }, 
                    ticks: { 
                        maxRotation: 45, 
                        minRotation: 45, 
                        font: { size: 9, weight: 'bold' } 
                    } 
                }
            }
        }
    });
}

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function draw() {
    clearMapLayers();

    visibleMunicipalities.forEach((m) => {
        if (m.points.length >= 3) {
            let hull = convexHull(m.points);

            let poly = L.polygon(hull.map(p => [p.lat, p.lng]), {
                color: m.color,
                fillColor: m.color,
                fillOpacity: 0.25,
                weight: 4
            }).addTo(map);

            poly.on('mouseover', function() { this.setStyle({ fillOpacity: 0.45, weight: 6 }); });
            poly.on('mouseout', function() { this.setStyle({ fillOpacity: 0.25, weight: 4 }); });

            polygons.push(poly);
        } else if (m.points.length > 0) {
            let circle = L.circleMarker([m.centerLat, m.centerLng], {
                radius: 16,
                color: m.color,
                fillColor: m.color,
                fillOpacity: 0.35,
                weight: 4
            }).addTo(map);

            polygons.push(circle);
        }

        // ✅ إخفاء الرقم - عرض اسم البلدية فقط
        let label = L.marker([m.centerLat, m.centerLng], {
            icon: L.divIcon({
                className: 'custom-label',
                html: `<div class="map-label-container" style="border-color: ${m.color};">
                    ${escapeHtml(m.municipality)}
                </div>`,
                iconSize: null,
                iconAnchor: [50, 15]
            })
        }).addTo(map);

        labels.push(label);
    });
}

function convexHull(points) {
    const pts = points.map(p => [p.lat, p.lng]);
    if (pts.length <= 3) return pts.map(p => ({ lat: p[0], lng: p[1] }));

    pts.sort((a, b) => a[0] === b[0] ? a[1] - b[1] : a[0] - b[0]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];

    for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
        lower.push(p);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
        upper.push(p);
    }
    upper.pop(); 
    lower.pop();
    return lower.concat(upper).map(p => ({ lat: p[0], lng: p[1] }));
}

function fitAll() {
    if (visibleMunicipalities.length === 0) return;

    let bounds = [];
    visibleMunicipalities.forEach(m => m.points.forEach(p => bounds.push([p.lat, p.lng])));
    if (bounds.length) {
        map.fitBounds(bounds, { padding: [50, 50] });
    }
}

function clearMapLayers() {
    polygons.forEach(p => map.removeLayer(p));
    labels.forEach(l => map.removeLayer(l));
    polygons = [];
    labels = [];
}

function showNotification(message) {
    const notif = document.createElement('div');
    notif.style.cssText = `
        position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.85); color: white; padding: 15px 30px;
        border-radius: 30px; font-weight: 600; z-index: 100001;
        transition: opacity .3s ease;
    `;
    notif.textContent = message;
    document.body.appendChild(notif);
    setTimeout(() => { 
        notif.style.opacity = '0'; 
        setTimeout(() => notif.remove(), 300); 
    }, 3000);
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function exportExcel() {
    if (exportRows.length <= 1) { 
        alert('لا توجد بيانات'); 
        return; 
    }
    let ws = XLSX.utils.aoa_to_sheet(exportRows);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "البلديات");
    XLSX.writeFile(wb, "تحليل_البلديات.xlsx");
}

        topRow.appendChild(chartStatsBox);

        const categoriesBox = document.createElement('div');
        categoriesBox.className = 'export-categories';
        categoriesBox.innerHTML = `
            <div class="card-title">📊 توزيع التصنيفات</div>
            <div class="chart-area">
                <canvas id="exportChart2"></canvas>
            </div>
        `;

        leftColumn.appendChild(topRow);
        leftColumn.appendChild(categoriesBox);

        const mapBox = document.createElement('div');
        mapBox.className = 'export-map';
        mapBox.innerHTML = '<div id="mapExport"></div>';

        exportContainer.appendChild(leftColumn);
        exportContainer.appendChild(mapBox);
        document.body.appendChild(exportContainer);

        document.getElementById('exportTotalReports').textContent = document.getElementById('totalReports').textContent;
        document.getElementById('exportTotalDistricts').textContent = document.getElementById('totalDistricts').textContent;
        document.getElementById('exportTopDistrict').textContent = document.getElementById('topDistrict').textContent;

        document.getElementById('exportLegend').innerHTML = document.getElementById('legendBox').innerHTML;

        await new Promise(resolve => setTimeout(resolve, 300));

        const exportMap = L.map('mapExport', {
            zoomControl: false,
            attributionControl: false,
            preferCanvas: true
        }).setView(map.getCenter(), map.getZoom());

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            crossOrigin: true
        }).addTo(exportMap);

        visibleMunicipalities.forEach((m) => {
            if (m.points.length >= 3) {
                let hull = convexHull(m.points);

                L.polygon(hull.map(p => [p.lat, p.lng]), {
                    color: m.color,
                    fillColor: m.color,
                    fillOpacity: 0.25,
                    weight: 4
                }).addTo(exportMap);
            } else if (m.points.length > 0) {
                L.circleMarker([m.centerLat, m.centerLng], {
                    radius: 16,
                    color: m.color,
                    fillColor: m.color,
                    fillOpacity: 0.35,
                    weight: 4
                }).addTo(exportMap);
            }

            // ✅ في التصدير: اسم البلدية فقط بدون رقم
            L.marker([m.centerLat, m.centerLng], {
                icon: L.divIcon({
                    className: 'custom-label',
                    html: `<div class="map-label-container" style="border-color: ${m.color};">
                        ${escapeHtml(m.municipality)}
                    </div>`,
                    iconSize: null,
                    iconAnchor: [50, 15]
                })
            }).addTo(exportMap);
        });

        await new Promise(resolve => setTimeout(resolve, 1800));

        drawExportCharts();
        await new Promise(resolve => setTimeout(resolve, 500));

        const canvas = await html2canvas(exportContainer, {
            width: 1920,
            height: 980,
            scale: 1,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#667eea',
            logging: false
        });

        const finalCanvas = document.createElement('canvas');
        const ctx = finalCanvas.getContext('2d');

        finalCanvas.width = 1920;
        finalCanvas.height = 1080;

        const gradient = ctx.createLinearGradient(0, 0, 0, 100);
        gradient.addColorStop(0, '#667eea');
        gradient.addColorStop(1, '#764ba2');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1920, 100);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 44px "Segoe UI", Tahoma, Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📊 تقرير تحليل البلديات', 960, 45);

        ctx.font = 'bold 24px "Segoe UI", Tahoma, Arial';
        ctx.fillText(new Date().toLocaleDateString('ar-SA', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        }), 960, 75);

        ctx.drawImage(canvas, 0, 100);

        finalCanvas.toBlob(blob => {
            saveAs(blob, `تقرير_البلديات_${new Date().toLocaleDateString('ar-SA')}.png`);
            showNotification('✅ تم تصدير السلايد بنجاح!');
            document.body.classList.remove('exporting');
            exportContainer.remove();
        }, 'image/png');

    } catch (err) {
        console.error(err);
        alert('حدث خطأ: ' + err.message);
        document.body.classList.remove('exporting');
        const exportContainer = document.getElementById('exportContainer');
        if (exportContainer) exportContainer.remove();
    }
}
